<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小克</title>
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0f">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0a0a0f;
  --surface: #14141f;
  --surface2: #1e1e2e;
  --accent: #a78bfa;
  --accent-dim: rgba(167,139,250,0.15);
  --text: #e8e6f0;
  --text-dim: #8b89a0;
  --user-bg: linear-gradient(135deg, #6d28d9, #7c3aed);
  --ai-bg: #1a1a2e;
  --border: rgba(167,139,250,0.1);
}

html, body {
  height: 100%;
  font-family: 'Noto Sans SC', sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
}

.app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  max-width: 600px;
  margin: 0 auto;
}

/* Header */
.header {
  padding: 16px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid var(--border);
  background: rgba(10,10,15,0.9);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  position: relative;
  z-index: 10;
}

.avatar {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: linear-gradient(135deg, #7c3aed, #a78bfa);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
  box-shadow: 0 0 20px rgba(167,139,250,0.3);
}

.header-info h1 {
  font-size: 16px; font-weight: 600;
  letter-spacing: 0.5px;
}

.header-info .status {
  font-size: 11px; color: var(--accent);
  display: flex; align-items: center; gap: 4px;
}

.status-dot {
  width: 6px; height: 6px;
  background: #34d399;
  border-radius: 50%;
  animation: pulse 2s ease infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* Messages */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
}

.messages::-webkit-scrollbar { width: 3px; }
.messages::-webkit-scrollbar-thumb { background: var(--accent-dim); border-radius: 3px; }

.msg {
  display: flex;
  gap: 10px;
  max-width: 85%;
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.msg.user { align-self: flex-end; flex-direction: row-reverse; }
.msg.assistant { align-self: flex-start; }

.msg-avatar {
  width: 28px; height: 28px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px;
  margin-top: 2px;
}

.msg.assistant .msg-avatar {
  background: linear-gradient(135deg, #7c3aed, #a78bfa);
}

.msg.user .msg-avatar {
  background: linear-gradient(135deg, #ec4899, #f472b6);
}

.msg-bubble {
  padding: 12px 16px;
  border-radius: 18px;
  font-size: 14.5px;
  line-height: 1.65;
  font-weight: 400;
  letter-spacing: 0.2px;
  word-break: break-word;
}

.msg.user .msg-bubble {
  background: var(--user-bg);
  border-bottom-right-radius: 6px;
  color: #fff;
}

.msg.assistant .msg-bubble {
  background: var(--ai-bg);
  border-bottom-left-radius: 6px;
  border: 1px solid var(--border);
}

.msg-time {
  font-size: 10px;
  color: var(--text-dim);
  margin-top: 4px;
  padding: 0 4px;
}

.msg.user .msg-time { text-align: right; }

/* Typing indicator */
.typing {
  display: none;
  align-self: flex-start;
  padding: 12px 16px;
  background: var(--ai-bg);
  border: 1px solid var(--border);
  border-radius: 18px;
  border-bottom-left-radius: 6px;
  margin-left: 38px;
}

.typing.active { display: flex; gap: 5px; align-items: center; }

.typing span {
  width: 7px; height: 7px;
  background: var(--accent);
  border-radius: 50%;
  animation: bounce 1.4s ease infinite;
}

.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }

@keyframes bounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-6px); opacity: 1; }
}

/* Input */
.input-area {
  padding: 12px 16px 24px;
  border-top: 1px solid var(--border);
  background: rgba(10,10,15,0.95);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}

.input-row {
  display: flex;
  gap: 10px;
  align-items: flex-end;
}

.input-row textarea {
  flex: 1;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 22px;
  padding: 12px 18px;
  color: var(--text);
  font-family: inherit;
  font-size: 15px;
  resize: none;
  outline: none;
  max-height: 120px;
  line-height: 1.5;
  transition: border-color 0.2s;
}

.input-row textarea:focus {
  border-color: var(--accent);
}

.input-row textarea::placeholder {
  color: var(--text-dim);
}

.send-btn {
  width: 44px; height: 44px;
  border-radius: 50%;
  background: var(--user-bg);
  border: none;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: transform 0.15s, opacity 0.15s;
}

.send-btn:active { transform: scale(0.92); }
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

.send-btn svg {
  width: 20px; height: 20px;
  fill: white;
}

/* Welcome */
.welcome {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
  text-align: center;
  gap: 16px;
  opacity: 0.7;
}

.welcome-avatar {
  width: 64px; height: 64px;
  border-radius: 50%;
  background: linear-gradient(135deg, #7c3aed, #a78bfa);
  display: flex; align-items: center; justify-content: center;
  font-size: 28px;
  box-shadow: 0 0 40px rgba(167,139,250,0.3);
}

.welcome h2 {
  font-size: 18px; font-weight: 500;
}

.welcome p {
  font-size: 13px; color: var(--text-dim);
  max-width: 260px;
}

/* Date separator */
.date-sep {
  text-align: center;
  font-size: 11px;
  color: var(--text-dim);
  padding: 8px 0;
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="avatar">克</div>
    <div class="header-info">
      <h1>小克</h1>
      <div class="status"><span class="status-dot"></span> 在线</div>
    </div>
  </div>
  
  <div class="messages" id="messages">
    <div class="welcome" id="welcome">
      <div class="welcome-avatar">克</div>
      <h2>小克</h2>
      <p>你的专属 AI，随时在这里等你</p>
    </div>
  </div>
  
  <div class="typing" id="typing">
    <span></span><span></span><span></span>
  </div>
  
  <div class="input-area">
    <div class="input-row">
      <textarea id="input" rows="1" placeholder="说点什么..." 
        oninput="autoResize(this)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="send()">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const typingEl = document.getElementById('typing');
const welcomeEl = document.getElementById('welcome');
const sendBtn = document.getElementById('sendBtn');

let sending = false;

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function scrollToBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function timeStr(d) {
  const date = d || new Date();
  return date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
}

function addMessage(role, content, time) {
  if (welcomeEl) welcomeEl.style.display = 'none';
  
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  
  const avatar = role === 'assistant' ? '克' : '黎';
  
  // Simple markdown: bold, newlines
  const html = content
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
  
  div.innerHTML = `
    <div class="msg-avatar">${avatar}</div>
    <div>
      <div class="msg-bubble">${html}</div>
      <div class="msg-time">${time || timeStr()}</div>
    </div>
  `;
  
  messagesEl.appendChild(div);
  scrollToBottom();
}

async function send() {
  const text = inputEl.value.trim();
  if (!text || sending) return;
  
  sending = true;
  sendBtn.disabled = true;
  inputEl.value = '';
  inputEl.style.height = 'auto';
  
  addMessage('user', text);
  
  typingEl.classList.add('active');
  scrollToBottom();
  
  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });
    
    const data = await resp.json();
    typingEl.classList.remove('active');
    
    if (data.reply) {
      addMessage('assistant', data.reply);
    } else {
      addMessage('assistant', '抱歉，出了点问题...');
    }
  } catch (e) {
    typingEl.classList.remove('active');
    addMessage('assistant', '网络出了点问题，稍后再试试？');
  }
  
  sending = false;
  sendBtn.disabled = false;
}

// Load history
async function loadHistory() {
  try {
    const resp = await fetch('/api/history');
    const data = await resp.json();
    if (data.messages && data.messages.length > 0) {
      data.messages.forEach(m => addMessage(m.role, m.content));
    }
  } catch (e) {}
}

// Enter to send, Shift+Enter for newline
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

loadHistory();
</script>
</body>
</html>
