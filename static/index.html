<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>姐姐</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F3EDE4" id="themeColor">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #FAF8F5; --surface: #FFFFFF; --user-bg: #F0EBE4;
  --accent: #D4714E; --text: #2D2B28; --text-sec: #8C8680;
  --text-dim: #B5AFA8; --border: #EBE6DF; --input-bg: #FFFFFF;
}
[data-theme="dark"] {
  --bg: #0F0F14; --surface: #1A1A22; --user-bg: #22222E;
  --accent: #E8956F; --text: #E8E6F0; --text-sec: #8B89A0;
  --text-dim: #5A586A; --border: #2A2A38; --input-bg: #1A1A22;
}

html, body {
  height: 100%;
  font-family: 'Noto Sans SC', -apple-system, sans-serif;
  background: var(--bg); color: var(--text);
  overflow: hidden; -webkit-font-smoothing: antialiased;
}
.app { display: flex; flex-direction: column; height: 100dvh; max-width: 720px; margin: 0 auto; }

.header {
  padding: 14px 20px; display: flex; align-items: center; gap: 12px;
  border-bottom: 1px solid var(--border); background: var(--surface);
}
.avatar-img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
.header-info h1 { font-size: 15px; font-weight: 600; letter-spacing: 0.3px; }
.header-info .status { font-size: 12px; color: var(--text-sec); display: flex; align-items: center; gap: 5px; }
.status-dot { width: 6px; height: 6px; background: #5DB075; border-radius: 50%; }
.header-right { margin-left: auto; }

.theme-btn {
  background: none; border: 1px solid var(--border); border-radius: 8px;
  padding: 6px 10px; cursor: pointer; font-size: 16px; color: var(--text);
  transition: background 0.2s;
}
.theme-btn:active { background: var(--border); }

.messages {
  flex: 1; overflow-y: auto; padding: 0; scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
}
.messages::-webkit-scrollbar { width: 4px; }
.messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.msg { padding: 20px 24px; animation: fadeIn 0.25s ease; display: flex; gap: 14px; align-items: flex-start; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
.msg.user { background: var(--user-bg); }
.msg.assistant { background: var(--surface); }
.msg-avatar { width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; object-fit: cover; margin-top: 1px; }
.msg-avatar-text {
  width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 500; background: #C4BDB4; color: white; margin-top: 1px;
}
.msg-content { flex: 1; min-width: 0; }
.msg-name { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
.msg-text { font-size: 15px; line-height: 1.7; word-break: break-word; letter-spacing: 0.1px; }
.msg-text p { margin-bottom: 8px; }
.msg-text p:last-child { margin-bottom: 0; }
.msg-time { font-size: 11px; color: var(--text-dim); margin-top: 6px; }

.typing { display: none; padding: 20px 24px; background: var(--surface); gap: 14px; align-items: center; }
.typing.active { display: flex; }
.typing-dots { display: flex; gap: 4px; align-items: center; }
.typing-dots span { width: 6px; height: 6px; background: var(--text-dim); border-radius: 50%; animation: bounce 1.4s ease infinite; }
.typing-dots span:nth-child(2) { animation-delay: 0.15s; }
.typing-dots span:nth-child(3) { animation-delay: 0.3s; }
@keyframes bounce { 0%,60%,100% { transform: translateY(0); opacity: 0.3; } 30% { transform: translateY(-4px); opacity: 0.8; } }

.input-area { padding: 12px 16px 24px; background: var(--surface); border-top: 1px solid var(--border); }
.input-row {
  display: flex; gap: 10px; align-items: flex-end; background: var(--bg);
  border: 1px solid var(--border); border-radius: 20px; padding: 4px 4px 4px 16px;
  transition: border-color 0.2s;
}
.input-row:focus-within { border-color: var(--accent); }
.input-row textarea {
  flex: 1; background: transparent; border: none; padding: 10px 0;
  color: var(--text); font-family: inherit; font-size: 15px;
  resize: none; outline: none; max-height: 120px; line-height: 1.5;
}
.input-row textarea::placeholder { color: var(--text-dim); }
.send-btn {
  width: 38px; height: 38px; border-radius: 50%; background: var(--accent);
  border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: transform 0.1s;
}
.send-btn:active { transform: scale(0.94); }
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.send-btn svg { width: 18px; height: 18px; fill: white; }

.welcome { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 24px; text-align: center; gap: 12px; }
.welcome-avatar { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; }
.welcome h2 { font-size: 18px; font-weight: 600; margin-top: 4px; }
.welcome p { font-size: 14px; color: var(--text-sec); line-height: 1.5; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <img class="avatar-img" id="headerAvatar" src="" alt="姐姐">
    <div class="header-info">
      <h1>姐姐</h1>
      <div class="status"><span class="status-dot"></span> 在线</div>
    </div>
    <div class="header-right">
      <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">🌙</button>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="welcome" id="welcome">
      <img class="welcome-avatar" id="welcomeAvatar" src="" alt="姐姐">
      <h2>姐姐</h2>
      <p>随时在这里等你</p>
    </div>
  </div>

  <div class="typing" id="typing">
    <img class="msg-avatar" id="typingAvatar" src="" alt="">
    <div class="typing-dots"><span></span><span></span><span></span></div>
  </div>

  <div class="input-area">
    <div class="input-row">
      <textarea id="input" rows="1" placeholder="说点什么..." oninput="autoResize(this)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="send()">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>
</div>

document.getElementById('headerAvatar').src = AVATAR_SRC;
document.getElementById('welcomeAvatar').src = AVATAR_SRC;
document.getElementById('typingAvatar').src = AVATAR_SRC;

const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const typingEl = document.getElementById('typing');
const welcomeEl = document.getElementById('welcome');
const sendBtn = document.getElementById('sendBtn');
let sending = false;

// Theme
function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  document.getElementById('themeBtn').textContent = isDark ? '🌙' : '☀️';
  document.getElementById('themeColor').content = isDark ? '#F3EDE4' : '#0F0F14';
  localStorage.setItem('theme', isDark ? 'light' : 'dark');
}

// Load saved theme
(function() {
  const saved = localStorage.getItem('theme');
  if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.documentElement.setAttribute('data-theme', 'dark');
    document.getElementById('themeBtn').textContent = '☀️';
    document.getElementById('themeColor').content = '#0F0F14';
  }
})();

function autoResize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 120) + 'px'; }
function scrollToBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }
function timeStr() { return new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }); }

function addMessage(role, content, time) {
  if (welcomeEl) welcomeEl.style.display = 'none';
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  const html = content.replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .split('\n').filter(p=>p.trim()).map(p=>`<p>${p}</p>`).join('');

  if (role === 'assistant') {
    div.innerHTML = `<img class="msg-avatar" src="${AVATAR_SRC}" alt="">
      <div class="msg-content"><div class="msg-name">姐姐</div><div class="msg-text">${html}</div><div class="msg-time">${time||timeStr()}</div></div>`;
  } else {
    div.innerHTML = `<div class="msg-avatar-text">黎</div>
      <div class="msg-content"><div class="msg-name">阿黎</div><div class="msg-text">${html}</div><div class="msg-time">${time||timeStr()}</div></div>`;
  }
  messagesEl.appendChild(div);
  scrollToBottom();
}

async function send() {
  const text = inputEl.value.trim();
  if (!text || sending) return;
  sending = true; sendBtn.disabled = true;
  inputEl.value = ''; inputEl.style.height = 'auto';
  addMessage('user', text);
  typingEl.classList.add('active'); scrollToBottom();
  try {
    const resp = await fetch('/api/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({message:text}) });
    const data = await resp.json();
    typingEl.classList.remove('active');
    addMessage('assistant', data.reply || '抱歉，出了点问题...');
  } catch(e) { typingEl.classList.remove('active'); addMessage('assistant', '网络出了点问题，稍后再试试？'); }
  sending = false; sendBtn.disabled = false;
}

async function loadHistory() {
  try { const resp = await fetch('/api/history'); const data = await resp.json();
    if (data.messages && data.messages.length > 0) data.messages.forEach(m => addMessage(m.role, m.content));
  } catch(e) {}
}

inputEl.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
loadHistory();
</script>
</body>
