<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>姐姐</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F3EDE4">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #FAF8F5;
  --surface: #FFFFFF;
  --surface-hover: #F5F1EC;
  --accent: #D4714E;
  --accent-light: rgba(212,113,78,0.1);
  --text: #2D2B28;
  --text-secondary: #8C8680;
  --text-dim: #B5AFA8;
  --border: #EBE6DF;
  --user-bg: #F0EBE4;
  --input-bg: #FFFFFF;
}

html, body {
  height: 100%;
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

.app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  max-width: 720px;
  margin: 0 auto;
}

/* Header */
.header {
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}

.avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: linear-gradient(145deg, #D4714E, #E8956F);
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
  color: white;
  font-weight: 500;
  flex-shrink: 0;
}

.header-info h1 {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: 0.3px;
}

.header-info .status {
  font-size: 12px;
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  gap: 5px;
}

.status-dot {
  width: 6px; height: 6px;
  background: #5DB075;
  border-radius: 50%;
}

/* Messages */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 0;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
}

.messages::-webkit-scrollbar { width: 4px; }
.messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.msg {
  padding: 20px 24px;
  animation: fadeIn 0.25s ease;
  display: flex;
  gap: 14px;
  align-items: flex-start;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

.msg.user {
  background: var(--user-bg);
}

.msg.assistant {
  background: var(--surface);
}

.msg-avatar {
  width: 30px; height: 30px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 500;
  margin-top: 1px;
}

.msg.assistant .msg-avatar {
  background: linear-gradient(145deg, #D4714E, #E8956F);
  color: white;
}

.msg.user .msg-avatar {
  background: #C4BDB4;
  color: white;
}

.msg-content {
  flex: 1;
  min-width: 0;
}

.msg-name {
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 4px;
  color: var(--text);
}

.msg-text {
  font-size: 15px;
  line-height: 1.7;
  color: var(--text);
  word-break: break-word;
  letter-spacing: 0.1px;
}

.msg-text p { margin-bottom: 8px; }
.msg-text p:last-child { margin-bottom: 0; }

.msg-time {
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 6px;
}

/* Typing */
.typing {
  display: none;
  padding: 20px 24px;
  background: var(--surface);
  gap: 14px;
  align-items: center;
}

.typing.active { display: flex; }

.typing .msg-avatar {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: linear-gradient(145deg, #D4714E, #E8956F);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; color: white; font-weight: 500;
}

.typing-dots {
  display: flex;
  gap: 4px;
  align-items: center;
}

.typing-dots span {
  width: 6px; height: 6px;
  background: var(--text-dim);
  border-radius: 50%;
  animation: bounce 1.4s ease infinite;
}

.typing-dots span:nth-child(2) { animation-delay: 0.15s; }
.typing-dots span:nth-child(3) { animation-delay: 0.3s; }

@keyframes bounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
  30% { transform: translateY(-4px); opacity: 0.8; }
}

/* Input */
.input-area {
  padding: 12px 16px 24px;
  background: var(--surface);
  border-top: 1px solid var(--border);
}

.input-row {
  display: flex;
  gap: 10px;
  align-items: flex-end;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 4px 4px 4px 16px;
  transition: border-color 0.2s;
}

.input-row:focus-within {
  border-color: var(--accent);
}

.input-row textarea {
  flex: 1;
  background: transparent;
  border: none;
  padding: 10px 0;
  color: var(--text);
  font-family: inherit;
  font-size: 15px;
  resize: none;
  outline: none;
  max-height: 120px;
  line-height: 1.5;
}

.input-row textarea::placeholder {
  color: var(--text-dim);
}

.send-btn {
  width: 38px; height: 38px;
  border-radius: 50%;
  background: var(--accent);
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background 0.15s, transform 0.1s;
}

.send-btn:hover { background: #C0623F; }
.send-btn:active { transform: scale(0.94); }
.send-btn:disabled { background: var(--text-dim); cursor: not-allowed; }

.send-btn svg {
  width: 18px; height: 18px;
  fill: white;
}

/* Welcome */
.welcome {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 24px;
  text-align: center;
  gap: 12px;
}

.welcome-avatar {
  width: 56px; height: 56px;
  border-radius: 50%;
  background: linear-gradient(145deg, #D4714E, #E8956F);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  color: white;
  font-weight: 500;
}

.welcome h2 {
  font-size: 18px;
  font-weight: 600;
  color: var(--text);
  margin-top: 4px;
}

.welcome p {
  font-size: 14px;
  color: var(--text-secondary);
  line-height: 1.5;
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="avatar">姐</div>
    <div class="header-info">
      <h1>姐姐</h1>
      <div class="status"><span class="status-dot"></span> 在线</div>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="welcome" id="welcome">
      <div class="welcome-avatar">姐</div>
      <h2>姐姐</h2>
      <p>随时在这里等你</p>
    </div>
  </div>

  <div class="typing" id="typing">
    <div class="msg-avatar">姐</div>
    <div class="typing-dots"><span></span><span></span><span></span></div>
  </div>

  <div class="input-area">
    <div class="input-row">
      <textarea id="input" rows="1" placeholder="说点什么..."
        oninput="autoResize(this)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="send()">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const typingEl = document.getElementById('typing');
const welcomeEl = document.getElementById('welcome');
const sendBtn = document.getElementById('sendBtn');
let sending = false;

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function scrollToBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function timeStr() {
  return new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
}

function addMessage(role, content, time) {
  if (welcomeEl) welcomeEl.style.display = 'none';

  const div = document.createElement('div');
  div.className = `msg ${role}`;

  const avatarText = role === 'assistant' ? '姐' : '黎';
  const nameText = role === 'assistant' ? '姐姐' : '阿黎';

  const html = content
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .split('\n').filter(p => p.trim()).map(p => `<p>${p}</p>`).join('');

  div.innerHTML = `
    <div class="msg-avatar">${avatarText}</div>
    <div class="msg-content">
      <div class="msg-name">${nameText}</div>
      <div class="msg-text">${html}</div>
      <div class="msg-time">${time || timeStr()}</div>
    </div>
  `;

  messagesEl.appendChild(div);
  scrollToBottom();
}

async function send() {
  const text = inputEl.value.trim();
  if (!text || sending) return;

  sending = true;
  sendBtn.disabled = true;
  inputEl.value = '';
  inputEl.style.height = 'auto';

  addMessage('user', text);
  typingEl.classList.add('active');
  scrollToBottom();

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });
    const data = await resp.json();
    typingEl.classList.remove('active');
    addMessage('assistant', data.reply || '抱歉，出了点问题...');
  } catch (e) {
    typingEl.classList.remove('active');
    addMessage('assistant', '网络出了点问题，稍后再试试？');
  }

  sending = false;
  sendBtn.disabled = false;
}

async function loadHistory() {
  try {
    const resp = await fetch('/api/history');
    const data = await resp.json();
    if (data.messages && data.messages.length > 0) {
      data.messages.forEach(m => addMessage(m.role, m.content));
    }
  } catch (e) {}
}

inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

loadHistory();
</script>
</body>
</html>
